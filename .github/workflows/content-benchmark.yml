name: Content benchmark

on:
  push:
    branches: ['benchmark/baseline', 'benchmark/structured-markdown']
    paths:
      - 'benchmarks/**'
      - '.github/workflows/content-benchmark.yml'
      - 'crates/obscura-dom/**'
      - 'crates/obscura-cli/**'
  pull_request:
    paths:
      - 'benchmarks/**'
      - '.github/workflows/content-benchmark.yml'
  workflow_dispatch:
    inputs:
      revision:
        description: Obscura source revision
        type: string
        default: '76db0c807f4bbaed062fcd3be7760adba49ac841'
        required: true
      public_pages:
        description: Include the public page benchmark
        type: boolean
        default: false

permissions:
  contents: read

env:
  BENCHMARK_NODE_VERSION: '22.23.5'

jobs:
  evaluator:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: benchmarks
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.BENCHMARK_NODE_VERSION }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test

  full:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: evaluator
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      OPENSSL_NO_VENDOR: '1'
    steps:
      - name: Check out benchmark harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out requested Obscura source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision || '76db0c807f4bbaed062fcd3be7760adba49ac841' }}
          path: target/benchmark-source
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.BENCHMARK_NODE_VERSION }}
          package-manager-cache: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake libclang-dev libssl-dev llvm-dev pkg-config
      - name: Build Obscura from source
        id: baseline
        working-directory: target/benchmark-source
        run: |
          unset OBSCURA_VERSION GITHUB_REF_TYPE GITHUB_REF_NAME GITHUB_REF
          cargo build --locked --release -p obscura-cli --bins --features render
          install -m 0755 target/release/obscura ../baseline-obscura
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and stage the converter candidate
        if: github.ref_name == 'benchmark/structured-markdown'
        working-directory: target/benchmark-source
        run: |
          unset OBSCURA_VERSION GITHUB_REF_TYPE GITHUB_REF_NAME GITHUB_REF
          git checkout --detach "$GITHUB_SHA"
          cargo build --locked --release -p obscura-cli --bins --features render
          install -m 0755 target/release/obscura ../structured-obscura
      - name: Install benchmark dependencies
        working-directory: benchmarks
        run: |
          npm ci --ignore-scripts
          node ./node_modules/playwright/cli.js install chromium --only-shell --with-deps
      - name: Run both browsers on the same host
        working-directory: benchmarks
        env:
          RUN_PUBLIC_BENCHMARK: ${{ inputs.public_pages || github.event_name == 'push' }}
          RUN_CANDIDATE: ${{ github.ref_name == 'benchmark/structured-markdown' }}
          BASELINE_REVISION: ${{ steps.baseline.outputs.revision }}
        run: |
          args=(--source-revision "$BASELINE_REVISION" --obscura-revision "$BASELINE_REVISION"
            --obscura ../target/baseline-obscura)
          if [[ "$RUN_CANDIDATE" == true ]]; then
            args+=(--converter ../target/structured-obscura --converter-revision HEAD --sections)
          fi
          npm run benchmark -- "${args[@]}"
          if [[ "$RUN_PUBLIC_BENCHMARK" == true ]]; then
            npm run benchmark -- --dataset public "${args[@]}"
          fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: obscura-content-benchmark
          path: |
            target/content-benchmark/benchmark_results.*
            target/content-benchmark-public/benchmark_results.*
          if-no-files-found: ignore
      - name: Install cargo-nextest
        if: github.ref_name == 'benchmark/structured-markdown'
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: nextest
          fallback: none
      - name: Test the modified crates
        if: github.ref_name == 'benchmark/structured-markdown'
        working-directory: target/benchmark-source
        run: cargo nextest run --release --features render -p obscura-dom -p obscura-cli --no-fail-fast
      - name: Test the workspace
        if: github.ref_name == 'benchmark/structured-markdown'
        working-directory: target/benchmark-source
        run: cargo nextest run --release --features render --no-fail-fast
      - name: Check out the pinned obstacle course
        if: github.ref_name == 'benchmark/structured-markdown'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: h4ckf0r0day/obscura-benchmark
          ref: 2d08d9a8e860e423b47209434a9fba9c75e6eee6
          path: target/obscura-benchmark
          persist-credentials: false
      - name: Run the obstacle course
        if: github.ref_name == 'benchmark/structured-markdown'
        run: |
          OBSCURA_BIN="$GITHUB_WORKSPACE/target/structured-obscura" \
            python3 target/obscura-benchmark/obstacle-course/run.py --runs 1 --warmup 0
